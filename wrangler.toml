name = "nt-ticket-monitor"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Free KV namespace — stores last known availability state so we don't spam you
[[kv_namespaces]]
binding = "TICKET_MONITOR_KV"
id = "65e5aa826f404ef4a8bef05cf312a470"   # filled in during setup

# Cron: run every 3 minutes, 24/7 (free tier allows 100k requests/day — this uses ~480/day)
[triggers]
crons = ["*/3 * * * *"]

# Secrets — set these via `wrangler secret put` (never put real values here)
# RESEND_API_KEY       — from resend.com (free, no credit card, 3k emails/month)
# ALERT_EMAIL          — the address to send alerts to (your email)
# SLACK_WEBHOOK_URL    — your Slack incoming webhook URL
